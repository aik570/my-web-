# Deployment on Netlify (recommended: free tier, EU-US DPF, DPA available,
# built-in GitHub OAuth for the CMS). Other static hosts: see docs/DEPLOY.md.

[build]
  command = "npm ci && npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Production may only publish when every launch blocker is resolved:
# official verified prices, complete legal pages, correct CMS repository.
# Test site before launch: set the environment variable HC_PREVIEW_SITE=1 in Netlify →
# built as a marked preview (noindex, "Vorschau"), launch check skipped. Remove it for the real launch.
[context.production]
  command = "npm ci && npm run build && ([ \"$HC_PREVIEW_SITE\" = \"1\" ] || npm run check)"

# Previews (pull requests, branch deploys) build normally. They are marked
# "Vorschau", set noindex and may show the labelled development prices.
[context.deploy-preview]
  command = "npm ci && npm run build"
[context.branch-deploy]
  command = "npm ci && npm run build"

# Security headers for the public site
[[headers]]
  for = "/*"
  [headers.values]
    # No Content-Security-Policy here: Netlify would add it to /admin/ as well, and the browser enforces
    # both policies – the strict one blocks the CMS. The site pages carry their policy as <meta> (base.njk).
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# The CMS talks to GitHub; it gets its own, wider policy and is never indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; connect-src 'self' https://api.github.com https://api.netlify.com; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

# Decap CMS code: one folder per version (eleventy.config.js), never changes -> cache for a year
[[headers]]
  for = "/admin/cms-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # always revalidate (cheap 304): file names do not change between deploys
    Cache-Control = "public, max-age=0, must-revalidate"

