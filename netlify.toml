# Deployment on Netlify (recommended: free tier, EU-US DPF, DPA available,
# built-in GitHub OAuth for the CMS). Other static hosts: see docs/DEPLOY.md.

[build]
  command = "npm ci && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Production may only publish when every launch blocker is resolved:
# official verified prices, complete legal pages, correct CMS repository.
[context.production]
  command = "npm ci && npm run build && npm run check"

# Previews (pull requests, branch deploys) build normally. They are marked
# "Vorschau", set noindex and may show the labelled development prices.
[context.deploy-preview]
  command = "npm ci && npm run build"
[context.branch-deploy]
  command = "npm ci && npm run build"

# Security headers for the public site
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# The CMS talks to GitHub; it gets its own, wider policy and is never indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; connect-src 'self' https://api.github.com https://api.netlify.com; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old URLs of the current site. Extend this list once the full URL list of the
# live site is known (see project-audit/07-risks-and-seo.md).
[[redirects]]
  from = "/franchise"
  to = "/franchise/"
  status = 301
[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz/"
  status = 301
[[redirects]]
  from = "/impressum"
  to = "/impressum/"
  status = 301

