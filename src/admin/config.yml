# Decap CMS configuration for Handy Chirurg Potsdam.
# Every save is a commit to the repository; the host rebuilds the site from it.
# Local development: `npm run cms` + `npm run dev`, then open http://localhost:8080/admin/

backend:
  name: github
  # PREVIEW SETUP: work repository and working branch, so CMS saves trigger
  # Netlify branch deploys of the preview. Before launch: client-owned repository
  # and its production branch (npm run check blocks launch until then).
  repo: aik570/my-web-
  branch: claude/zealous-bohr-71wesv
  # base_url / auth_endpoint: only needed when not hosted on Netlify (see docs/CMS.md)
  commit_messages:
    create: 'CMS: {{collection}} „{{slug}}" angelegt'
    update: 'CMS: {{collection}} „{{slug}}" geändert'
    delete: 'CMS: {{collection}} „{{slug}}" gelöscht'
    uploadMedia: 'CMS: Bild „{{path}}" hochgeladen'
    deleteMedia: 'CMS: Bild „{{path}}" gelöscht'

local_backend: true       # only used on localhost together with `npm run cms`
publish_mode: simple      # Speichern = Veröffentlichen
locale: de
site_url: https://www.handy-chirurg.de
display_url: https://www.handy-chirurg.de
logo_url: /assets/img/favicon.svg

media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads

collections:

  # ---------------------------------------------------------------- Preise
  # One collection per manufacturer, one file per model (src/content/models/<marke>/<modell>.json):
  # the editor only loads the model you open, so it stays fast with hundreds of models.
  - name: preise-apple
    label: "Preise · Apple"
    label_singular: Modell
    description: 'Ein Eintrag pro Modell mit seinen Reparaturen und Preisen. Suchen: Strg+F oder oben „Suchen". Ungültige Preise verhindern die Veröffentlichung.'
    folder: src/content/models/apple
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    slug: '{{name}}'
    summary: '{{name}}'
    sortable_fields: ['name']
    editor: { preview: false }
    fields:
      - { name: seq, label: Reihenfolge (intern), widget: hidden, required: false }
      - { name: name, label: Modell, widget: string, hint: 'Genaue Bezeichnung inkl. Variante, z. B. „iPhone 16 Pro Max", „Galaxy S24 Ultra". Die Reihenfolge auf der Website ergibt sich automatisch (neueste zuerst).' }
      - { name: id, label: Katalog-ID, widget: string, required: false, pattern: ['^([a-z0-9]+(-[a-z0-9]+)*)?$', 'Nur a–z, 0–9 und Bindestrich'], hint: 'Leer = wird aus dem Namen gebildet (z. B. iphone-16-pro-max). Bestimmt die Adresse /preise/<hersteller>/<id>/ und die Zuordnung des Produktfotos. Bei einer Umbenennung des Modells hier die bisherige ID eintragen, damit Links gleich bleiben.' }
      - { name: category, label: Gerätetyp, widget: select, options: [Smartphone, Tablet, Laptop, Smartwatch, PC, Sonstiges], default: Smartphone, required: false }
      - { name: group, label: Gruppe im Preisrechner, widget: string, required: false, hint: 'Leer = automatisch (z. B. „iPhone", „iPhone SE", „Galaxy S"). Nur eintragen, um die Überschrift zu ändern.' }
      - { name: position, label: Position, widget: number, value_type: int, min: 1, required: false, hint: 'Leer = automatisch, neueste zuerst. Eine Zahl setzt das Modell an diese Stelle der Liste (1 = ganz oben).' }
      - name: photo
        label: Produktfoto
        widget: object
        collapsed: true
        required: false
        hint: 'Foto dieses Modells im Preisrechner. Nur saubere Produktfotos (Gerät freigestellt auf Weiß, ganz sichtbar, keine Hände) mit Lizenz für die gewerbliche Nutzung.'
        fields:
          - { name: image, label: Foto, widget: image, required: false, media_folder: /src/assets/img/produkte, public_folder: /assets/img/produkte, hint: 'Hochladen oder ersetzen. Hochformat (z. B. 600 × 800), Gerät auf Weiß.' }
          - { name: license, label: Lizenz, widget: string, required: false, hint: 'Pflicht, sonst wird das Foto nicht gezeigt. z. B. „eigenes Foto", „iStock Standard (nicht redaktionell)", „CC BY-SA 4.0"' }
          - { name: rightsConfirmed, label: Nutzungsrecht bestätigt, widget: boolean, default: true, required: false, hint: 'Aus = Foto nur in der Vorschau, nicht auf der echten Website (z. B. Herstellerbild, Genehmigung fehlt noch)' }
          - { name: proof, label: Nachweis, widget: string, required: false, hint: 'Rechnungs- oder Genehmigungsnummer (wird nicht angezeigt)' }
          - { name: credit, label: Bildnachweis (angezeigt), widget: string, required: false, hint: 'Nur wenn die Lizenz eine Namensnennung verlangt' }
          - { name: licenseUrl, label: Link zur Lizenz, widget: string, required: false }
          - { name: source, label: Link zur Quelle, widget: string, required: false }
      - name: repairs
        label: Reparaturen
        label_singular: Reparatur
        widget: list
        summary: '{{fields.service}} · {{fields.label}} · {{fields.price}} €'
        collapsed: true
        fields:
          # a plain select (not a relation): a relation widget in each of the ~1,600 rows made the editor very slow.
          # Keep these options in sync with src/_data/repairTypes.json (npm test checks it).
          - name: service
            label: Reparaturart
            widget: select
            options:
              - { value: display, label: Display }
              - { value: akku, label: Akkuwechsel }
              - { value: backcover, label: Backcover }
              - { value: ladebuchse, label: Ladebuchse }
              - { value: hauptkamera, label: Hauptkamera }
              - { value: frontkamera, label: Frontkamera }
              - { value: lautsprecher, label: Lautsprecher }
              - { value: wifi-bluetooth, label: WiFi & Bluetooth }
              - { value: wasserschaden, label: Wasserschaden }
              - { value: platine, label: Platine }
              - { value: fehleranalyse, label: Fehleranalyse }
              - { value: panzerglas, label: Panzerglas }
              - { value: zubehoer, label: Zubehör }
          - { name: label, label: Bezeichnung, widget: string, required: false, hint: 'z. B. „Original" oder „Kompatibel". Leer = Name der Reparaturart' }
          - { name: price, label: Preis in €, widget: number, value_type: float, min: 0, max: 5000, step: 0.01, required: false, hint: 'Leer lassen, wenn „auf Anfrage"' }
          - { name: from, label: „ab"-Preis, widget: boolean, default: false, required: false }
          - { name: onRequest, label: Preis auf Anfrage, widget: boolean, default: false, required: false }
          - { name: note, label: Hinweis, widget: string, required: false }
          - { name: duration, label: Dauer (nur dieses Modell), widget: string, required: false, hint: 'Leer = Dauer der Reparaturart (Einstellungen › Reparaturarten), z. B. „ca. 90 Minuten"' }

